<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>순수본 CCP 자동화 시스템</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f0f4f8; min-height: 100vh; }

    .header {
      background: #1a3a5c; color: white;
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header .clock { font-size: 16px; font-weight: 600; letter-spacing: 1px; }

    .config-bar {
      background: #fff; padding: 12px 20px;
      display: flex; gap: 12px; align-items: center;
      border-bottom: 2px solid #e2e8f0; flex-wrap: wrap;
    }
    .config-bar label { font-size: 13px; color: #555; font-weight: 600; }
    .config-bar input {
      padding: 8px 12px; border: 1px solid #cbd5e0;
      border-radius: 8px; font-size: 14px; background: #f7fafc; width: 180px;
    }
    .btn-save-config {
      padding: 8px 18px; background: #1a3a5c; color: white;
      border: none; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px; padding: 16px;
    }

    .card {
      background: white; border-radius: 16px; padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border-left: 6px solid #cbd5e0; transition: border-color 0.3s;
    }
    .card.standby { border-left-color: #a0aec0; }
    .card.cooking { border-left-color: #f6ad55; }
    .card.ccp     { border-left-color: #48bb78; }

    .card-header {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 12px;
    }
    .pot-name { font-size: 20px; font-weight: 800; color: #1a3a5c; }
    .status-badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
    .badge-standby { background: #edf2f7; color: #718096; }
    .badge-cooking { background: #fefcbf; color: #b7791f; }
    .badge-ccp     { background: #c6f6d5; color: #276749; }
    .result-pass   { background: #c6f6d5; color: #276749; }
    .result-fail   { background: #fed7d7; color: #9b2c2c; }

    .temp-display { text-align: center; margin: 10px 0; }
    .temp-value { font-size: 42px; font-weight: 900; color: #1a3a5c; line-height: 1; }
    .temp-value.hot  { color: #e53e3e; }
    .temp-value.warm { color: #dd6b20; }
    .temp-unit { font-size: 18px; color: #718096; }

    .timer {
      text-align: center; font-size: 22px; font-weight: 800;
      color: #2d3748; margin: 6px 0; letter-spacing: 2px;
    }
    .timer.ccp-active { color: #276749; }

    .time-info {
      background: #f7fafc; border-radius: 10px;
      padding: 10px 14px; margin: 10px 0;
      font-size: 13px; color: #4a5568; line-height: 1.8;
    }
    .time-info span { font-weight: 700; color: #1a3a5c; }

    .product-list {
      min-height: 36px; margin: 8px 0;
      display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
    }
    .product-tag {
      display: inline-flex; align-items: center; gap: 4px;
      background: #ebf8ff; color: #2b6cb0;
      border-radius: 20px; padding: 4px 10px;
      font-size: 12px; font-weight: 600;
    }
    .product-tag.h-type { background: #fff5f5; color: #c53030; }
    .product-tag .del-btn {
      cursor: pointer; color: #e53e3e;
      font-size: 14px; font-weight: 900; margin-left: 2px;
    }
    .product-empty { color: #a0aec0; font-size: 13px; }

    .btn-scan {
      width: 100%; padding: 10px; margin: 6px 0;
      background: #edf2f7; color: #4a5568;
      border: 2px dashed #cbd5e0; border-radius: 10px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: all 0.2s;
    }
    .btn-scan:hover { background: #e2e8f0; border-color: #a0aec0; }

    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      margin-top: 6px; transition: opacity 0.2s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-start { background: #48bb78; color: white; }
    .btn-end   { background: #e53e3e; color: white; }
    .btn-reset { background: #a0aec0; color: white; font-size: 13px; padding: 8px; }

    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000; display: none;
      align-items: center; justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: white; border-radius: 20px;
      padding: 24px; width: 90%; max-width: 460px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .modal-title {
      font-size: 18px; font-weight: 800; color: #1a3a5c;
      margin-bottom: 6px;
    }
    .modal-subtitle {
      font-size: 13px; color: #718096; margin-bottom: 16px;
    }
    .modal-input-row {
      display: flex; gap: 8px; margin-bottom: 12px;
    }
    .modal-input {
      flex: 1; padding: 12px 14px;
      border: 2px solid #4299e1; border-radius: 10px;
      font-size: 16px; outline: none;
    }
    .modal-input:focus { border-color: #2b6cb0; }
    .modal-add-btn {
      padding: 12px 16px; background: #4299e1; color: white;
      border: none; border-radius: 10px;
      font-size: 20px; font-weight: 900; cursor: pointer;
    }

    .scan-preview {
      background: #f0fff4; border: 1px solid #9ae6b4;
      border-radius: 10px; padding: 10px 14px;
      font-size: 14px; color: #276749; font-weight: 600;
      margin-bottom: 12px; min-height: 40px;
      display: flex; align-items: center; gap: 8px;
    }
    .scan-preview.error { background: #fff5f5; border-color: #feb2b2; color: #c53030; }
    .scan-preview.empty { background: #f7fafc; border-color: #e2e8f0; color: #a0aec0; font-weight: 400; }

    .modal-product-list {
      background: #f7fafc; border-radius: 10px;
      padding: 10px 14px; margin-bottom: 16px;
      min-height: 50px; max-height: 180px; overflow-y: auto;
    }
    .modal-product-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 0; border-bottom: 1px solid #e2e8f0; font-size: 14px;
    }
    .modal-product-item:last-child { border-bottom: none; }
    .modal-product-item .pcode { color: #1a3a5c; font-weight: 700; margin-right: 8px; }
    .modal-product-item .pname { color: #4a5568; }
    .modal-product-item .pmin  { color: #718096; font-size: 12px; margin-left: 4px; }
    .modal-product-item .del   { color: #e53e3e; cursor: pointer; font-size: 18px; font-weight: 900; }
    .modal-empty { color: #a0aec0; font-size: 13px; text-align: center; padding: 10px 0; }

    .modal-footer { display: flex; gap: 10px; }
    .btn-modal-cancel {
      flex: 1; padding: 12px; background: #edf2f7; color: #4a5568;
      border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .btn-modal-done {
      flex: 2; padding: 12px; background: #1a3a5c; color: white;
      border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer;
    }

    .toast {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%);
      background: #1a3a5c; color: white;
      padding: 14px 28px; border-radius: 30px;
      font-size: 15px; font-weight: 600;
      z-index: 9999; display: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .loading {
      padding: 24px;
      text-align: center;
      color: #4a5568;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>🍚 순수본 CCP 자동화 시스템</h1>
  <div class="clock" id="clock">--:--:--</div>
</div>

<div class="config-bar">
  <label>점검자</label>
  <input type="text" id="inspector" placeholder="이름 입력">
  <button class="btn-save-config" onclick="saveConfig()">저장</button>
</div>

<div class="grid" id="grid">
  <div class="loading">데이터 불러오는 중...</div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-title" id="modal-title">제품 스캔</div>
    <div class="modal-subtitle">바코드를 스캔하거나 제품코드를 입력하세요 (자동 추가됩니다)</div>

    <div class="modal-input-row">
      <input class="modal-input" id="modal-input"
             placeholder="바코드 스캔 또는 직접 입력"
             oninput="onModalInput()"
             onkeydown="if(event.key==='Enter'){ event.preventDefault(); addFromModal(); }">
      <button class="modal-add-btn" onclick="addFromModal()">+</button>
    </div>

    <div class="scan-preview empty" id="scan-preview">바코드를 스캔하면 제품명이 여기에 표시됩니다</div>

    <div class="modal-product-list" id="modal-product-list">
      <div class="modal-empty">아직 등록된 제품이 없습니다</div>
    </div>

    <div class="modal-footer">
      <button class="btn-modal-cancel" onclick="closeModal()">취소</button>
      <button class="btn-modal-done" onclick="doneModal()">✅ 입력 완료</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var GAS_URL = "https://script.google.com/macros/s/AKfycbxiC_p6KbgQKXVKGv_Rl9wKOGQKDvpe_lnHchCAP-ksRvIX7chGPkTd3QcCYYy4_8A-/exec";

var INSPECTOR = localStorage.getItem("inspector") || "";
var POT_COUNT = 7;
var PRODUCT_DB = {};
var currentModalPot = null;
var CCP_TEMP = 90;

var sessions = {};

window.onload = async function() {
  document.getElementById("inspector").value = INSPECTOR;

  await loadInitialData();
  buildSessionObjects();
  buildGrid();

  setInterval(updateClocks, 1000);
  setInterval(updateTimers, 1000);
  setInterval(function() {
    for (var i = 1; i <= POT_COUNT; i++) {
      pollSession(i);
    }
  }, 2000);
};

async function loadInitialData() {
  try {
    const [settingsRes, productsRes] = await Promise.all([
      fetch(GAS_URL + "?action=getSettings&_=" + Date.now()),
      fetch(GAS_URL + "?action=getProducts&_=" + Date.now())
    ]);

    const settings = await settingsRes.json();
    const products = await productsRes.json();

    POT_COUNT = parseInt(settings.potCount, 10) || 7;
    CCP_TEMP = parseFloat(settings.ccpTemp) || 90;

    PRODUCT_DB = {};
    products.forEach(function(p) {
      PRODUCT_DB[String(p.barcode).trim().toUpperCase()] = {
        name: String(p.name || "").trim(),
        type: String(p.type || "").trim().toUpperCase(),
        baseMin: parseFloat(p.baseMin) || 55
      };
    });
  } catch (err) {
    console.error(err);
    showToast("초기 데이터 불러오기 실패");
  }
}

function buildSessionObjects() {
  sessions = {};
  for (var i = 1; i <= POT_COUNT; i++) {
    sessions[i] = {
      status: "standby",
      barcodes: [],
      startTime: null,
      ccp90Time: null,
      lastTemp: null
    };
  }
}

function saveConfig() {
  INSPECTOR = document.getElementById("inspector").value.trim();
  localStorage.setItem("inspector", INSPECTOR);
  showToast("점검자 이름이 저장되었습니다!");
}

function lookupProduct(code) {
  code = String(code || "").trim().toUpperCase();
  return PRODUCT_DB[code] || null;
}

function buildGrid() {
  var grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (var i = 1; i <= POT_COUNT; i++) {
    grid.innerHTML += cardHTML(i);
  }
}

function cardHTML(pot) {
  return `
  <div class="card standby" id="card-${pot}">
    <div class="card-header">
      <div class="pot-name">${pot}번 취반기</div>
      <div class="status-badge badge-standby" id="badge-${pot}">대기중</div>
    </div>
    <div class="temp-display">
      <span class="temp-value" id="temp-${pot}">--</span>
      <span class="temp-unit">°C</span>
    </div>
    <div class="timer" id="timer-${pot}">00:00:00</div>
    <div class="time-info" id="timeinfo-${pot}">
      <span>취반시작:</span> --<br>
      <span>${CCP_TEMP}°C 도달:</span> --<br>
      <span>CCP 경과:</span> --분
    </div>
    <div class="product-list" id="product-list-${pot}">
      <span class="product-empty">제품을 스캔하세요</span>
    </div>
    <button class="btn-scan" onclick="openModal(${pot})">📷 바코드 스캔 / 제품 추가</button>
    <button class="btn btn-start" id="btn-start-${pot}" onclick="startCooking(${pot})">▶ 취반 시작</button>
    <button class="btn btn-end" id="btn-end-${pot}" onclick="endCooking(${pot})" disabled>■ 취반 종료</button>
    <button class="btn btn-reset" onclick="resetPot(${pot})">초기화</button>
  </div>`;
}

function openModal(pot) {
  currentModalPot = pot;
  document.getElementById("modal-title").textContent = pot + "번 취반기 제품 스캔";
  document.getElementById("modal-input").value = "";
  document.getElementById("scan-preview").textContent = "바코드를 스캔하면 제품명이 여기에 표시됩니다";
  document.getElementById("scan-preview").className = "scan-preview empty";
  renderModalList();
  document.getElementById("modal-overlay").classList.add("active");
  setTimeout(function() {
    document.getElementById("modal-input").focus();
  }, 100);
}

function closeModal() {
  document.getElementById("modal-overlay").classList.remove("active");
  currentModalPot = null;
}

function doneModal() {
  closeModal();
}

function onModalInput() {
  var val = document.getElementById("modal-input").value.trim().toUpperCase();
  var preview = document.getElementById("scan-preview");

  if (!val) {
    preview.textContent = "바코드를 스캔하면 제품명이 여기에 표시됩니다";
    preview.className = "scan-preview empty";
    return;
  }

  var p = lookupProduct(val);
  if (p) {
    preview.textContent = "✅ " + val + " / " + p.name + " (기준: " + p.baseMin + "분)";
    preview.className = "scan-preview";
  } else {
    preview.textContent = "❌ " + val + " — 등록되지 않은 제품코드입니다";
    preview.className = "scan-preview error";
  }
}

function addFromModal() {
  var input = document.getElementById("modal-input");
  var code = input.value.trim().toUpperCase();

  if (!code || currentModalPot === null) return;

  var pot = currentModalPot;

  if (sessions[pot].barcodes.indexOf(code) >= 0) {
    showToast("이미 추가된 제품입니다");
    input.value = "";
    onModalInput();
    input.focus();
    return;
  }

  var p = lookupProduct(code);
  if (!p) {
    showToast("등록되지 않은 제품코드입니다: " + code);
    input.value = "";
    onModalInput();
    input.focus();
    return;
  }

  sessions[pot].barcodes.push(code);
  renderModalList();
  renderProductTags(pot);

  input.value = "";
  document.getElementById("scan-preview").textContent = "바코드를 스캔하면 제품명이 여기에 표시됩니다";
  document.getElementById("scan-preview").className = "scan-preview empty";
  input.focus();
}

function renderModalList() {
  var pot = currentModalPot;
  var el = document.getElementById("modal-product-list");

  if (!pot || sessions[pot].barcodes.length === 0) {
    el.innerHTML = '<div class="modal-empty">아직 등록된 제품이 없습니다</div>';
    return;
  }

  var html = "";
  sessions[pot].barcodes.forEach(function(code, idx) {
    var p = lookupProduct(code);
    var name = p ? p.name : code;
    var min = p ? p.baseMin + "분" : "--";
    html += '<div class="modal-product-item">' +
      '<span><span class="pcode">' + code + '</span><span class="pname">' + name + '</span><span class="pmin">(' + min + ')</span></span>' +
      '<span class="del" onclick="removeFromModal(' + idx + ')">×</span>' +
      '</div>';
  });

  el.innerHTML = html;
}

function removeFromModal(idx) {
  if (currentModalPot === null) return;
  sessions[currentModalPot].barcodes.splice(idx, 1);
  renderModalList();
  renderProductTags(currentModalPot);
}

function renderProductTags(pot) {
  var el = document.getElementById("product-list-" + pot);
  var barcodes = sessions[pot].barcodes;

  if (!barcodes || barcodes.length === 0) {
    el.innerHTML = '<span class="product-empty">제품을 스캔하세요</span>';
    return;
  }

  var html = "";
  barcodes.forEach(function(code, idx) {
    var p = lookupProduct(code);
    var name = p ? p.name : code;
    var isH = p && p.type === "H";
    html += '<span class="product-tag' + (isH ? ' h-type' : '') + '">' +
            code + ' ' + name +
            '<span class="del-btn" onclick="removeTag(' + pot + ',' + idx + ')">×</span></span>';
  });
  el.innerHTML = html;
}

function removeTag(pot, idx) {
  sessions[pot].barcodes.splice(idx, 1);
  renderProductTags(pot);
}

function startCooking(pot) {
  if (sessions[pot].barcodes.length === 0) {
    showToast("제품을 먼저 스캔해주세요");
    return;
  }

  var now = new Date();
  sessions[pot].status = "cooking";
  sessions[pot].startTime = now;
  sessions[pot].ccp90Time = null;

  var barcodeStr = sessions[pot].barcodes.join(",");

  fetch(
    GAS_URL + "?action=start" +
    "&pot=" + encodeURIComponent(pot + "번솥") +
    "&barcode=" + encodeURIComponent(barcodeStr) +
    "&inspector=" + encodeURIComponent(INSPECTOR)
  )
  .then(function(r) { return r.text(); })
  .catch(function(e) { console.warn(e); });

  updateCardUI(pot);
  document.getElementById("btn-start-" + pot).disabled = true;
  document.getElementById("btn-end-" + pot).disabled = false;
  showToast(pot + "번 취반기 취반 시작");
}

function endCooking(pot) {
  if (!confirm(pot + "번 취반기를 종료하시겠습니까?")) return;

  fetch(
    GAS_URL + "?action=end" +
    "&pot=" + encodeURIComponent(pot + "번솥")
  )
  .then(function(r) { return r.text(); })
  .then(function(t) {
    var result = t.indexOf("적합") >= 0 ? "적합" : (t.indexOf("부적합") >= 0 ? "부적합" : "");
    if (result) {
      var badge = document.getElementById("badge-" + pot);
      badge.textContent = result;
      badge.className = "status-badge " + (result === "적합" ? "result-pass" : "result-fail");
    }
    showToast(pot + "번 취반기 종료");
  })
  .catch(function(e) { console.warn(e); });

  sessions[pot].status = "standby";
  sessions[pot].barcodes = [];
  sessions[pot].startTime = null;
  sessions[pot].ccp90Time = null;

  updateCardUI(pot);
  renderProductTags(pot);

  document.getElementById("btn-start-" + pot).disabled = false;
  document.getElementById("btn-end-" + pot).disabled = true;
}

function resetPot(pot) {
  sessions[pot] = {
    status: "standby",
    barcodes: [],
    startTime: null,
    ccp90Time: null,
    lastTemp: null
  };

  document.getElementById("btn-start-" + pot).disabled = false;
  document.getElementById("btn-end-" + pot).disabled = true;
  renderProductTags(pot);
  updateCardUI(pot);

  document.getElementById("temp-" + pot).textContent = "--";
  document.getElementById("temp-" + pot).className = "temp-value";
}

function pollSession(pot) {
  fetch(
    GAS_URL + "?action=getSession" +
    "&pot=" + encodeURIComponent(pot + "번솥") +
    "&_=" + Date.now()
  )
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (!data || !data["취반기번호"]) return;

    var temp = parseFloat(data["최근온도"]);
    if (!isNaN(temp)) {
      sessions[pot].lastTemp = temp;
      var el = document.getElementById("temp-" + pot);
      el.textContent = temp.toFixed(1);
      el.className = "temp-value" + (temp >= CCP_TEMP ? " hot" : temp >= 70 ? " warm" : "");
    }

    var serverStatus = data["상태"] || "";
    var serverBarcode = String(data["제품코드"] || "");

    if (serverStatus === "취반중" && sessions[pot].status === "standby") {
      sessions[pot].status = "cooking";

      if (data["취반시작"]) {
        sessions[pot].startTime = new Date(data["취반시작"].replace(" ", "T"));
      }

      if (serverBarcode) {
        sessions[pot].barcodes = serverBarcode.split(",").map(function(b) {
          return b.trim().toUpperCase();
        }).filter(function(b) {
          return b !== "";
        });
        renderProductTags(pot);
      }

      document.getElementById("card-" + pot).className = "card cooking";
      document.getElementById("badge-" + pot).textContent = "취반중";
      document.getElementById("badge-" + pot).className = "status-badge badge-cooking";
      document.getElementById("btn-start-" + pot).disabled = true;
      document.getElementById("btn-end-" + pot).disabled = false;
    }

    if (serverStatus === "대기" && sessions[pot].status === "cooking") {
      sessions[pot].status = "standby";
      sessions[pot].startTime = null;
      sessions[pot].ccp90Time = null;
      sessions[pot].barcodes = [];
      updateCardUI(pot);
      renderProductTags(pot);
      document.getElementById("btn-start-" + pot).disabled = false;
      document.getElementById("btn-end-" + pot).disabled = true;
    }

    if (data["90°C도달"]) {
      sessions[pot].ccp90Time = new Date(data["90°C도달"].replace(" ", "T"));
      document.getElementById("card-" + pot).className = "card ccp";
      document.getElementById("badge-" + pot).textContent = "CCP 구간";
      document.getElementById("badge-" + pot).className = "status-badge badge-ccp";
    }

    updateTimeInfo(pot, data);
  })
  .catch(function() {});
}

function updateTimeInfo(pot, data) {
  var el = document.getElementById("timeinfo-" + pot);
  var start = data["취반시작"] || "--";
  var ccp90 = data["90°C도달"] || "--";

  if (start !== "--") start = start.substring(0, 19);
  if (ccp90 !== "--") ccp90 = ccp90.substring(0, 19);

  var ccpMin = "--";
  if (data["90°C도달"]) {
    var diff = Math.floor((new Date() - new Date(data["90°C도달"].replace(" ", "T"))) / 60000);
    ccpMin = diff + "분";
  }

  el.innerHTML =
    "<span>취반시작:</span> " + start + "<br>" +
    "<span>" + CCP_TEMP + "°C 도달:</span> " + ccp90 + "<br>" +
    "<span>CCP 경과:</span> " + ccpMin;
}

function updateCardUI(pot) {
  var s = sessions[pot];
  var card = document.getElementById("card-" + pot);
  var badge = document.getElementById("badge-" + pot);
  var timerEl = document.getElementById("timer-" + pot);
  var timeinfoEl = document.getElementById("timeinfo-" + pot);

  if (s.status === "standby") {
    card.className = "card standby";
    badge.textContent = "대기중";
    badge.className = "status-badge badge-standby";
    timerEl.textContent = "00:00:00";
    timerEl.className = "timer";
    timeinfoEl.innerHTML =
      "<span>취반시작:</span> --<br>" +
      "<span>" + CCP_TEMP + "°C 도달:</span> --<br>" +
      "<span>CCP 경과:</span> --분";
  } else if (s.status === "cooking") {
    card.className = "card cooking";
    badge.textContent = "취반중";
    badge.className = "status-badge badge-cooking";
  }
}

function updateTimers() {
  var now = new Date();

  for (var i = 1; i <= POT_COUNT; i++) {
    var s = sessions[i];
    if (s.status !== "standby" && s.startTime) {
      var diff = Math.floor((now - s.startTime) / 1000);
      var h = String(Math.floor(diff / 3600)).padStart(2, "0");
      var m = String(Math.floor((diff % 3600) / 60)).padStart(2, "0");
      var sec = String(diff % 60).padStart(2, "0");

      var el = document.getElementById("timer-" + i);
      el.textContent = h + ":" + m + ":" + sec;
      if (s.ccp90Time) {
        el.className = "timer ccp-active";
      }
    }
  }
}

function updateClocks() {
  var now = new Date();
  document.getElementById("clock").textContent =
    String(now.getHours()).padStart(2, "0") + ":" +
    String(now.getMinutes()).padStart(2, "0") + ":" +
    String(now.getSeconds()).padStart(2, "0");
}

function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(function() {
    t.style.display = "none";
  }, 3000);
}
</script>
</body>
</html>
