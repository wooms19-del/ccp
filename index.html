<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>순수본 CCP 자동화 시스템</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: #eef2f7;
      color: #16345d;
    }
    .topbar {
      background: #173b69;
      color: #fff;
      padding: 18px 24px;
      font-size: 18px;
      font-weight: 700;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      background: #f7f8fb;
      border-bottom: 1px solid #d8dee8;
      flex-wrap: wrap;
    }
    .toolbar label {
      font-weight: 700;
      color: #333;
    }
    .toolbar input {
      height: 36px;
      padding: 0 12px;
      border: 1px solid #c7d0db;
      border-radius: 8px;
      min-width: 180px;
    }
    .toolbar button {
      height: 36px;
      padding: 0 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      background: #173b69;
      color: #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 18px;
      padding: 18px;
    }

    .pot-card {
      background: #fff;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      border-left: 5px solid #b8c7db;
      min-height: 520px;
      display: flex;
      flex-direction: column;
    }

    .pot-card.cooking {
      border-left-color: #f0a340;
    }

    .pot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .pot-title {
      font-size: 22px;
      font-weight: 800;
      color: #173b69;
    }

    .badge {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .badge.wait {
      background: #edf2f8;
      color: #6e7f97;
    }

    .badge.run {
      background: #f7e79b;
      color: #9b6b00;
    }

    .temp-box {
      text-align: center;
      margin-bottom: 8px;
      font-size: 44px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #16345d;
    }

    .temp-box span {
      font-size: 28px;
      color: #5f6f84;
    }

    .timer-box {
      text-align: center;
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 16px;
      color: #16345d;
    }

    .info-box {
      background: #f3f6fb;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      line-height: 1.9;
      font-weight: 700;
      color: #16345d;
      min-height: 122px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 42px;
      margin-bottom: 14px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #e8f1fb;
      color: #245ca6;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: 700;
    }

    .chip button {
      border: none;
      background: transparent;
      color: #ef4a4a;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 0;
    }

    .scan-wrap {
      margin-top: 6px;
      margin-bottom: 14px;
    }

    .scan-btn, .action-btn, .reset-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      height: 46px;
    }

    .scan-btn {
      background: #f5f7fa;
      border: 2px dashed #cdd8e6;
      color: #4d5d73;
      margin-bottom: 10px;
    }

    .action-btn.start {
      background: #52c27a;
      color: white;
      margin-bottom: 10px;
    }

    .action-btn.end {
      background: #ec4040;
      color: white;
      margin-bottom: 10px;
    }

    .reset-btn {
      background: #8ea0b7;
      color: white;
    }

    .action-btn:disabled,
    .reset-btn:disabled,
    .scan-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .bottom-note {
      margin-top: auto;
      font-size: 12px;
      color: #7d8da4;
      padding-top: 12px;
    }
  </style>
</head>
<body>
  <div class="topbar">🍚 순수본 CCP 자동화 시스템</div>

  <div class="toolbar">
    <label for="inspectorName">점검자</label>
    <input id="inspectorName" type="text" placeholder="이름 입력" />
    <button onclick="saveInspector()">저장</button>
  </div>

  <div id="potGrid" class="grid"></div>

  <script>
    // ===========================
    // 본인 GAS 웹앱 URL로 교체
    // ===========================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxiC_p6KbgQKXVKGv_Rl9wKOGQKDvpe_lnHchCAP-ksRvIX7chGPkTd3QcCYYy4_8A-/exec";

    const POT_COUNT = 7;

    const potStates = {};
    const timerIntervals = {};

    function initPotStates() {
      for (let i = 1; i <= POT_COUNT; i++) {
        potStates[i] = {
          potLabel: `${i}번솥`,
          status: "대기중",
          temp: "--",
          startTime: "",
          reach90: "",
          timerBase: "",
          products: [],
          jobId: ""
        };
      }
    }

    function saveInspector() {
      const name = document.getElementById("inspectorName").value.trim();
      localStorage.setItem("ccp_inspector_name", name);
      alert("저장되었습니다.");
    }

    function loadInspector() {
      const saved = localStorage.getItem("ccp_inspector_name") || "";
      document.getElementById("inspectorName").value = saved;
    }

    function renderPots() {
      const grid = document.getElementById("potGrid");
      grid.innerHTML = "";

      for (let i = 1; i <= POT_COUNT; i++) {
        const state = potStates[i];
        const cooking = state.status === "취반중";

        const card = document.createElement("div");
        card.className = `pot-card ${cooking ? "cooking" : ""}`;
        card.id = `pot-${i}`;

        card.innerHTML = `
          <div class="pot-header">
            <div class="pot-title">${i}번 취반기</div>
            <div class="badge ${cooking ? "run" : "wait"}">${cooking ? "취반중" : "대기중"}</div>
          </div>

          <div class="temp-box">${state.temp}<span>°C</span></div>
          <div class="timer-box" id="timer-${i}">00:00:00</div>

          <div class="info-box">
            <div>취반시작: <span id="start-${i}">${state.startTime || "--"}</span></div>
            <div>90°C 도달: <span id="reach-${i}">${state.reach90 || "--"}</span></div>
            <div>CCP 경과: <span id="ccp-${i}">${getCCPElapsedText(i)}</span></div>
          </div>

          <div class="chips" id="chips-${i}"></div>

          <div class="scan-wrap">
            <button class="scan-btn" onclick="scanProduct(${i})">📷 바코드 스캔 / 제품 추가</button>
            <button class="action-btn start" onclick="startCooking(${i})" ${state.products.length === 0 || cooking ? "disabled" : ""}>▶ 취반 시작</button>
            <button class="action-btn end" onclick="endCooking(${i})" ${!cooking ? "disabled" : ""}>■ 취반 종료</button>
            <button class="reset-btn" onclick="resetPotUIOnly(${i})">초기화</button>
          </div>

          <div class="bottom-note">${state.jobId ? "작업번호: " + state.jobId : ""}</div>
        `;

        grid.appendChild(card);
        renderPotProducts(i);

        if (cooking && state.timerBase) {
          startLocalTimer(i, state.timerBase);
        }
      }
    }

    function renderPotProducts(potNo) {
      const wrap = document.getElementById(`chips-${potNo}`);
      if (!wrap) return;

      wrap.innerHTML = "";
      const items = potStates[potNo].products || [];

      items.forEach((item, idx) => {
        const chip = document.createElement("div");
        chip.className = "chip";
        chip.innerHTML = `
          <span>${item.code} ${item.name} [${item.workType || "처음생산"}]</span>
          <button type="button" onclick="removeProductFromPot(${potNo}, ${idx})">×</button>
        `;
        wrap.appendChild(chip);
      });
    }

    function removeProductFromPot(potNo, idx) {
      if (potStates[potNo].status === "취반중") return;
      potStates[potNo].products.splice(idx, 1);
      renderPots();
    }

    async function scanProduct(potNo) {
      if (potStates[potNo].status === "취반중") return;

      const code = prompt("제품코드(예: A01)를 입력하세요.");
      if (!code) return;

      const trimmedCode = code.trim().toUpperCase();

      const products = await getProducts();
      const found = products.find(p => String(p.barcode).trim().toUpperCase() === trimmedCode);

      if (!found) {
        alert("제품목록에서 찾을 수 없는 제품코드입니다.");
        return;
      }

      await addProductToPot(potNo, found);
    }

    async function getProducts() {
      try {
        const res = await fetch(`${GAS_URL}?action=getProducts&_=${Date.now()}`);
        return await res.json();
      } catch (err) {
        console.error(err);
        alert("제품목록 조회 실패");
        return [];
      }
    }

    // =========================================
    // 핵심: 진행중/완료된 제품 둘 다 경고창 띄움
    // =========================================
    async function checkDuplicateProductAndAsk(code) {
      const res = await fetch(
        `${GAS_URL}?action=checkTodayProduct&code=${encodeURIComponent(code)}&_=${Date.now()}`
      );
      const data = await res.json();

      console.log("중복체크 결과:", data);

      if (!data || !data.exists) {
        return {
          duplicated: false,
          workType: "처음생산"
        };
      }

      let msg = "오늘 이미 생산된 제품입니다.\n\n";

      if (data.source === "세션상태") {
        msg += "현재 진행중인 작업에도 같은 제품이 있습니다.\n\n";
      } else if (data.source === "CCP일지") {
        msg += "오늘 완료된 이력이 있는 제품입니다.\n\n";
      } else {
        msg += "동일 제품 이력이 있습니다.\n\n";
      }

      if (data.rows && data.rows.length > 0) {
        msg += data.rows.map(function(row, idx) {
          return [
            `[${idx + 1}]`,
            row.작업번호 ? `작업번호: ${row.작업번호}` : "",
            row.취반기번호 ? `취반기: ${row.취반기번호}` : "",
            row.제품코드 ? `제품코드: ${row.제품코드}` : "",
            row.제품명 ? `제품명: ${row.제품명}` : "",
            row.취반시작 ? `시작: ${row.취반시작}` : "",
            row.종료시간 ? `종료: ${row.종료시간}` : "",
            row.작업구분 ? `작업구분: ${row.작업구분}` : ""
          ].filter(Boolean).join(" / ");
        }).join("\n");

        msg += "\n\n";
      }

      msg += "1 입력 = 재작업\n";
      msg += "2 입력 = 추가작업\n";
      msg += "취소 또는 다른 값 = 등록 취소";

      const answer = prompt(msg, "1");

      if (answer === "1") {
        return {
          duplicated: true,
          workType: "재작업"
        };
      }

      if (answer === "2") {
        return {
          duplicated: true,
          workType: "추가작업"
        };
      }

      return {
        duplicated: true,
        cancelled: true
      };
    }

    async function addProductToPot(potNo, product) {
      if (!product || !product.barcode) {
        alert("제품 정보가 없습니다.");
        return;
      }

      const existsInSamePot = potStates[potNo].products.some(
        p => p.code === product.barcode
      );
      if (existsInSamePot) {
        alert("이미 같은 호기에 등록된 제품입니다.");
        return;
      }

      const checkResult = await checkDuplicateProductAndAsk(product.barcode);

      if (checkResult.cancelled) {
        return;
      }

      const workType = checkResult.workType || "처음생산";

      potStates[potNo].products.push({
        code: product.barcode,
        name: product.name,
        workType: workType
      });

      renderPots();
    }

    async function startCooking(potNo) {
      const state = potStates[potNo];
      if (!state || !state.products.length) {
        alert("제품을 먼저 추가하세요.");
        return;
      }

      if (state.status === "취반중") {
        alert("이미 취반중입니다.");
        return;
      }

      const inspector = (document.getElementById("inspectorName").value || "").trim();
      const barcodeList = state.products.map(p => p.code).join(",");
      const workType = state.products[0].workType || "처음생산";

      try {
        const url =
          `${GAS_URL}?action=start` +
          `&pot=${encodeURIComponent(state.potLabel)}` +
          `&barcode=${encodeURIComponent(barcodeList)}` +
          `&inspector=${encodeURIComponent(inspector)}` +
          `&workType=${encodeURIComponent(workType)}` +
          `&_=${Date.now()}`;

        const res = await fetch(url);
        const data = await res.json();

        console.log("취반 시작 응답:", data);

        if (!data.success) {
          alert(data.message || "취반 시작 실패");
          return;
        }

        const nowStr = getNowKSTString();
        state.status = "취반중";
        state.startTime = nowStr;
        state.timerBase = nowStr;
        state.reach90 = "";
        state.temp = "--";
        state.jobId = data.jobId || "";

        startLocalTimer(potNo, nowStr);
        renderPots();
      } catch (err) {
        console.error(err);
        alert("취반 시작 중 오류");
      }
    }

    async function endCooking(potNo) {
      const state = potStates[potNo];
      if (!state || state.status !== "취반중") {
        alert("현재 취반중이 아닙니다.");
        return;
      }

      const corrective = prompt("개선조치 내용을 입력하세요.\n적합이면 그냥 확인 눌러도 됩니다.", "") || "";

      try {
        const url =
          `${GAS_URL}?action=end` +
          `&pot=${encodeURIComponent(state.potLabel)}` +
          `&corrective=${encodeURIComponent(corrective)}` +
          `&_=${Date.now()}`;

        const res = await fetch(url);
        const data = await res.json();

        console.log("취반 종료 응답:", data);

        if (!data.success) {
          alert(data.message || "취반 종료 실패");
          return;
        }

        stopLocalTimer(potNo);

        potStates[potNo] = {
          potLabel: `${potNo}번솥`,
          status: "대기중",
          temp: "--",
          startTime: "",
          reach90: "",
          timerBase: "",
          products: [],
          jobId: ""
        };

        renderPots();
      } catch (err) {
        console.error(err);
        alert("취반 종료 중 오류");
      }
    }

    function resetPotUIOnly(potNo) {
      if (potStates[potNo].status === "취반중") {
        alert("취반중에는 초기화할 수 없습니다.");
        return;
      }

      stopLocalTimer(potNo);

      potStates[potNo] = {
        potLabel: `${potNo}번솥`,
        status: "대기중",
        temp: "--",
        startTime: "",
        reach90: "",
        timerBase: "",
        products: [],
        jobId: ""
      };

      renderPots();
    }

    async function refreshSessions() {
      for (let i = 1; i <= POT_COUNT; i++) {
        try {
          const res = await fetch(
            `${GAS_URL}?action=getSession&pot=${encodeURIComponent(i + "번솥")}&_=${Date.now()}`
          );
          const data = await res.json();

          if (data && data["상태"] === "취반중") {
            potStates[i].status = "취반중";
            potStates[i].jobId = data["작업번호"] || "";
            potStates[i].startTime = data["취반시작"] || "";
            potStates[i].reach90 = data["90°C도달"] || "";
            potStates[i].temp = data["최근온도"] || "--";
            potStates[i].timerBase = data["취반시작"] || "";

            const codes = String(data["제품코드"] || "")
              .split(",")
              .map(v => v.trim())
              .filter(Boolean);

            const products = await getProducts();
            potStates[i].products = codes.map(code => {
              const found = products.find(p => String(p.barcode).trim().toUpperCase() === code.toUpperCase());
              return {
                code: code,
                name: found ? found.name : code,
                workType: data["작업구분"] || "처음생산"
              };
            });
          }
        } catch (err) {
          console.error(`세션 조회 실패 ${i}번`, err);
        }
      }

      renderPots();
    }

    function startLocalTimer(potNo, startStr) {
      stopLocalTimer(potNo);

      timerIntervals[potNo] = setInterval(() => {
        const el = document.getElementById(`timer-${potNo}`);
        if (!el) return;

        el.textContent = calcElapsedText(startStr);

        const ccpEl = document.getElementById(`ccp-${potNo}`);
        if (ccpEl) {
          ccpEl.textContent = getCCPElapsedText(potNo);
        }
      }, 1000);
    }

    function stopLocalTimer(potNo) {
      if (timerIntervals[potNo]) {
        clearInterval(timerIntervals[potNo]);
        delete timerIntervals[potNo];
      }
    }

    function calcElapsedText(startStr) {
      if (!startStr) return "00:00:00";

      const start = parseKSTString(startStr);
      if (!start) return "00:00:00";

      const diff = Math.max(0, Date.now() - start.getTime());
      const totalSec = Math.floor(diff / 1000);

      const hh = String(Math.floor(totalSec / 3600)).padStart(2, "0");
      const mm = String(Math.floor((totalSec % 3600) / 60)).padStart(2, "0");
      const ss = String(totalSec % 60).padStart(2, "0");

      return `${hh}:${mm}:${ss}`;
    }

    function getCCPElapsedText(potNo) {
      const reach90 = potStates[potNo].reach90;
      if (!reach90 || reach90 === "-") return "--";

      return calcElapsedText(reach90);
    }

    function parseKSTString(str) {
      if (!str || typeof str !== "string") return null;
      const iso = str.replace(" ", "T") + "+09:00";
      const d = new Date(iso);
      if (isNaN(d.getTime())) return null;
      return d;
    }

    function getNowKSTString() {
      const now = new Date();
      const kst = new Date(now.getTime() + 9 * 60 * 60 * 1000);

      const y = kst.getUTCFullYear();
      const m = String(kst.getUTCMonth() + 1).padStart(2, "0");
      const d = String(kst.getUTCDate()).padStart(2, "0");
      const hh = String(kst.getUTCHours()).padStart(2, "0");
      const mm = String(kst.getUTCMinutes()).padStart(2, "0");
      const ss = String(kst.getUTCSeconds()).padStart(2, "0");

      return `${y}-${m}-${d} ${hh}:${mm}:${ss}`;
    }

    initPotStates();
    loadInspector();
    renderPots();
    refreshSessions();

    setInterval(refreshSessions, 10000);
  </script>
</body>
</html>
