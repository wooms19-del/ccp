<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>순수본 CCP 자동화 시스템</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f0f4f8; min-height: 100vh; }

    .header {
      background: #1a3a5c; color: white;
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header .clock { font-size: 16px; font-weight: 600; letter-spacing: 1px; }

    .config-bar {
      background: #fff; padding: 12px 20px;
      display: flex; gap: 12px; align-items: center;
      border-bottom: 2px solid #e2e8f0; flex-wrap: wrap;
    }
    .config-bar label { font-size: 13px; color: #555; font-weight: 600; }
    .config-bar input {
      padding: 8px 12px; border: 1px solid #cbd5e0;
      border-radius: 8px; font-size: 14px; background: #f7fafc; width: 180px;
    }
    .btn-save-config {
      padding: 8px 18px; background: #1a3a5c; color: white;
      border: none; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px; padding: 16px;
    }

    .card {
      background: white; border-radius: 16px; padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border-left: 6px solid #cbd5e0; transition: border-color 0.3s;
    }
    .card.standby { border-left-color: #a0aec0; }
    .card.cooking { border-left-color: #f6ad55; }
    .card.ccp     { border-left-color: #48bb78; }

    .card-header {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 12px;
    }
    .pot-name { font-size: 20px; font-weight: 800; color: #1a3a5c; }
    .status-badge {
      font-size: 12px; font-weight: 700;
      padding: 4px 10px; border-radius: 20px;
    }
    .badge-standby { background: #edf2f7; color: #718096; }
    .badge-cooking { background: #fefcbf; color: #b7791f; }
    .badge-ccp     { background: #c6f6d5; color: #276749; }
    .result-pass   { background: #c6f6d5; color: #276749; }
    .result-fail   { background: #fed7d7; color: #9b2c2c; }

    .temp-display { text-align: center; margin: 10px 0; }
    .temp-value { font-size: 42px; font-weight: 900; color: #1a3a5c; line-height: 1; }
    .temp-value.hot  { color: #e53e3e; }
    .temp-value.warm { color: #dd6b20; }
    .temp-unit { font-size: 18px; color: #718096; }

    .timer {
      text-align: center; font-size: 22px; font-weight: 800;
      color: #2d3748; margin: 6px 0; letter-spacing: 2px;
    }
    .timer.ccp-active { color: #276749; }

    .time-info {
      background: #f7fafc; border-radius: 10px;
      padding: 10px 14px; margin: 10px 0;
      font-size: 13px; color: #4a5568; line-height: 1.8;
    }
    .time-info span { font-weight: 700; color: #1a3a5c; }

    /* 제품 목록 */
    .product-list {
      background: #f7fafc; border-radius: 10px;
      padding: 8px 12px; margin: 8px 0;
      min-height: 36px;
    }
    .product-tag {
      display: inline-flex; align-items: center; gap: 4px;
      background: #ebf8ff; color: #2b6cb0;
      border-radius: 20px; padding: 3px 10px;
      font-size: 13px; font-weight: 600; margin: 2px;
    }
    .product-tag .del-btn {
      cursor: pointer; color: #e53e3e;
      font-size: 14px; font-weight: 900; line-height: 1;
      margin-left: 2px;
    }
    .product-empty { color: #a0aec0; font-size: 13px; }

    /* 바코드 입력 */
    .barcode-row { display: flex; gap: 8px; margin: 8px 0; }
    .barcode-input {
      flex: 1; padding: 10px 12px;
      border: 2px solid #cbd5e0; border-radius: 10px;
      font-size: 14px; outline: none;
    }
    .barcode-input:focus { border-color: #4299e1; }
    .btn-add-barcode {
      padding: 10px 14px; background: #4299e1; color: white;
      border: none; border-radius: 10px; font-size: 18px;
      font-weight: 900; cursor: pointer;
    }

    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      margin-top: 8px; transition: opacity 0.2s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-start { background: #48bb78; color: white; }
    .btn-end   { background: #e53e3e; color: white; }
    .btn-reset { background: #a0aec0; color: white; font-size: 13px; padding: 8px; }

    .toast {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%);
      background: #1a3a5c; color: white;
      padding: 14px 28px; border-radius: 30px;
      font-size: 15px; font-weight: 600;
      z-index: 9999; display: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

<div class="header">
  <h1>🍚 순수본 CCP 자동화 시스템</h1>
  <div class="clock" id="clock">--:--:--</div>
</div>

<div class="config-bar">
  <label>점검자</label>
  <input type="text" id="inspector" placeholder="이름 입력">
  <button class="btn-save-config" onclick="saveConfig()">저장</button>
</div>

<div class="grid" id="grid"></div>
<div class="toast" id="toast"></div>

<script>
var GAS_URL   = "https://script.google.com/macros/s/AKfycbxiC_p6KbgQKXVKGv_Rl9wKOGQKDvpe_lnHchCAP-ksRvIX7chGPkTd3QcCYYy4_8A-/exec";
var INSPECTOR = localStorage.getItem("inspector") || "";
var POT_COUNT = 7;
var productCache = {};  // barcode → {name, baseMin}

var sessions = {};
for (var i = 1; i <= POT_COUNT; i++) {
  sessions[i] = {
    status: "standby",
    barcodes: [],      // 여러 바코드 배열
    startTime: null,
    ccp90Time: null,
    lastTemp: null
  };
}

window.onload = function() {
  document.getElementById("inspector").value = INSPECTOR;
  buildGrid();
  loadProducts();
  setInterval(updateClocks, 1000);
  setInterval(updateTimers, 1000);
};

function saveConfig() {
  INSPECTOR = document.getElementById("inspector").value.trim();
  localStorage.setItem("inspector", INSPECTOR);
  showToast("점검자 이름이 저장되었습니다!");
}

// ── 제품 목록 로드 ────────────────────────────────────────────
function loadProducts() {
  fetch(GAS_URL + "?action=getProducts&_=" + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(list) {
      if (!Array.isArray(list)) return;
      list.forEach(function(p) {
        if (p.barcode) {
          productCache[String(p.barcode)] = { name: p.name || String(p.barcode), baseMin: p.baseMin || 55 };
        }
      });
    }).catch(function() {});
}

function getProductName(barcode) {
  var p = productCache[String(barcode)];
  return p ? p.name : null;
}

// ── 카드 그리드 ───────────────────────────────────────────────
function buildGrid() {
  var grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (var i = 1; i <= POT_COUNT; i++) grid.innerHTML += cardHTML(i);
}

function cardHTML(pot) {
  return `
  <div class="card standby" id="card-${pot}">
    <div class="card-header">
      <div class="pot-name">${pot}번 취반기</div>
      <div class="status-badge badge-standby" id="badge-${pot}">대기중</div>
    </div>
    <div class="temp-display">
      <span class="temp-value" id="temp-${pot}">--</span>
      <span class="temp-unit">°C</span>
    </div>
    <div class="timer" id="timer-${pot}">00:00:00</div>
    <div class="time-info" id="timeinfo-${pot}">
      <span>취반시작:</span> --<br>
      <span>90°C 도달:</span> --<br>
      <span>CCP 경과:</span> --분
    </div>

    <!-- 등록된 제품 태그 목록 -->
    <div class="product-list" id="product-list-${pot}">
      <span class="product-empty">제품을 스캔하세요</span>
    </div>

    <!-- 바코드 입력 + 추가 버튼 -->
    <div class="barcode-row">
      <input class="barcode-input" id="barcode-${pot}"
             placeholder="바코드 스캔 또는 입력"
             oninput="previewProduct(${pot})"
             onkeydown="if(event.key==='Enter') addBarcode(${pot})">
      <button class="btn-add-barcode" onclick="addBarcode(${pot})" title="추가">+</button>
    </div>

    <button class="btn btn-start" id="btn-start-${pot}" onclick="startCooking(${pot})">▶ 취반 시작</button>
    <button class="btn btn-end"   id="btn-end-${pot}"   onclick="endCooking(${pot})" disabled>■ 취반 종료</button>
    <button class="btn btn-reset" onclick="resetPot(${pot})">초기화</button>
  </div>`;
}

// ── 바코드 입력 미리보기 ──────────────────────────────────────
function previewProduct(pot) {
  var barcode = document.getElementById("barcode-" + pot).value.trim();
  // 입력 중에는 특별한 처리 없음 (Enter 또는 + 버튼으로 추가)
}

// ── 바코드 추가 ───────────────────────────────────────────────
function addBarcode(pot) {
  var input = document.getElementById("barcode-" + pot);
  var barcode = input.value.trim();
  if (!barcode) return;

  // 중복 체크
  if (sessions[pot].barcodes.indexOf(barcode) >= 0) {
    showToast("이미 추가된 제품이에요!");
    input.value = "";
    return;
  }

  // 제품명 조회
  var name = getProductName(barcode);
  if (!name) {
    // 캐시에 없으면 서버에서 다시 로드 후 추가
    fetch(GAS_URL + "?action=getProducts&_=" + Date.now())
      .then(function(r) { return r.json(); })
      .then(function(list) {
        if (Array.isArray(list)) {
          list.forEach(function(p) {
            if (p.barcode) productCache[String(p.barcode)] = { name: p.name || String(p.barcode), baseMin: p.baseMin || 55 };
          });
        }
        var n = getProductName(barcode) || barcode;
        sessions[pot].barcodes.push(barcode);
        renderProductTags(pot);
        showToast("📦 " + n + " 추가됨!");
      }).catch(function() {
        sessions[pot].barcodes.push(barcode);
        renderProductTags(pot);
      });
  } else {
    sessions[pot].barcodes.push(barcode);
    renderProductTags(pot);
    showToast("📦 " + name + " 추가됨!");
  }

  input.value = "";
  input.focus();
}

// ── 제품 태그 렌더링 ──────────────────────────────────────────
function renderProductTags(pot) {
  var el = document.getElementById("product-list-" + pot);
  var barcodes = sessions[pot].barcodes;
  if (!barcodes || barcodes.length === 0) {
    el.innerHTML = '<span class="product-empty">제품을 스캔하세요</span>';
    return;
  }
  var html = "";
  barcodes.forEach(function(bc, idx) {
    var name = getProductName(bc) || bc;
    html += '<span class="product-tag">📦 ' + name +
            ' <span class="del-btn" onclick="removeBarcode(' + pot + ',' + idx + ')">×</span></span>';
  });
  el.innerHTML = html;
}

// ── 제품 삭제 ─────────────────────────────────────────────────
function removeBarcode(pot, idx) {
  sessions[pot].barcodes.splice(idx, 1);
  renderProductTags(pot);
}

// ── 취반 시작 ─────────────────────────────────────────────────
function startCooking(pot) {
  if (sessions[pot].barcodes.length === 0) {
    showToast("제품을 먼저 스캔해주세요!");
    return;
  }

  var now = new Date();
  sessions[pot].status    = "cooking";
  sessions[pot].startTime = now;
  sessions[pot].ccp90Time = null;

  // 바코드 여러 개를 쉼표로 연결해서 전송
  var barcodeStr = sessions[pot].barcodes.join(",");

  fetch(GAS_URL + "?action=start&pot=" + encodeURIComponent(pot + "번솥")
    + "&barcode=" + encodeURIComponent(barcodeStr)
    + "&inspector=" + encodeURIComponent(INSPECTOR))
    .then(function(r) { return r.text(); })
    .then(function(t) { console.log("start:", t); })
    .catch(function(e) { console.warn(e); });

  updateCardUI(pot);
  document.getElementById("btn-start-" + pot).disabled = true;
  document.getElementById("btn-end-"   + pot).disabled = false;
  showToast(pot + "번 취반기 취반 시작! (" + sessions[pot].barcodes.length + "개 제품)");
}

// ── 취반 종료 ─────────────────────────────────────────────────
function endCooking(pot) {
  if (!confirm(pot + "번 취반기 취반을 종료하시겠습니까?")) return;

  fetch(GAS_URL + "?action=end&pot=" + encodeURIComponent(pot + "번솥"))
    .then(function(r) { return r.text(); })
    .then(function(t) {
      var result = t.indexOf("적합") >= 0 ? "적합" : (t.indexOf("부적합") >= 0 ? "부적합" : "");
      showToast(pot + "번 취반기 종료! " + (result ? "판정: " + result : ""));
      if (result) {
        var badge = document.getElementById("badge-" + pot);
        badge.textContent = result;
        badge.className = "status-badge " + (result === "적합" ? "result-pass" : "result-fail");
      }
    }).catch(function(e) { console.warn(e); });

  sessions[pot].status = "standby";
  sessions[pot].barcodes = [];
  updateCardUI(pot);
  document.getElementById("btn-start-" + pot).disabled = false;
  document.getElementById("btn-end-"   + pot).disabled = true;
  renderProductTags(pot);
}

// ── 초기화 ────────────────────────────────────────────────────
function resetPot(pot) {
  sessions[pot] = { status: "standby", barcodes: [], startTime: null, ccp90Time: null, lastTemp: null };
  document.getElementById("barcode-" + pot).value = "";
  document.getElementById("btn-start-" + pot).disabled = false;
  document.getElementById("btn-end-"   + pot).disabled = true;
  renderProductTags(pot);
  updateCardUI(pot);
}

// ── 2초마다 서버 폴링 ─────────────────────────────────────────
setInterval(function() {
  for (var i = 1; i <= POT_COUNT; i++) pollSession(i);
}, 2000);

function pollSession(pot) {
  fetch(GAS_URL + "?action=getSession&pot=" + encodeURIComponent(pot + "번솥") + "&_=" + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!data || !data["취반기번호"]) return;

      // 온도 업데이트
      var temp = parseFloat(data["최근온도"]);
      if (!isNaN(temp)) {
        sessions[pot].lastTemp = temp;
        var el = document.getElementById("temp-" + pot);
        el.textContent = temp.toFixed(1);
        el.className = "temp-value" + (temp >= 90 ? " hot" : temp >= 70 ? " warm" : "");
      }

      var serverStatus = data["상태"] || "";
      var serverBarcode = String(data["제품코드"] || "");

      // 다른 기기에서 취반 시작한 경우
      if (serverStatus === "취반중" && sessions[pot].status === "standby") {
        sessions[pot].status = "cooking";
        if (data["취반시작"]) {
          sessions[pot].startTime = new Date(data["취반시작"].replace(" ", "T"));
        }
        // 바코드 여러 개 파싱 (쉼표 구분)
        if (serverBarcode) {
          sessions[pot].barcodes = serverBarcode.split(",").map(function(b) { return b.trim(); });
          renderProductTags(pot);
        }
        var card = document.getElementById("card-" + pot);
        card.className = "card cooking";
        document.getElementById("badge-" + pot).textContent = "취반중";
        document.getElementById("badge-" + pot).className = "status-badge badge-cooking";
        document.getElementById("btn-start-" + pot).disabled = true;
        document.getElementById("btn-end-"   + pot).disabled = false;
      }

      // 다른 기기에서 취반 종료한 경우
      if (serverStatus === "대기" && sessions[pot].status === "cooking") {
        sessions[pot].status = "standby";
        sessions[pot].startTime = null;
        sessions[pot].ccp90Time = null;
        sessions[pot].barcodes = [];
        updateCardUI(pot);
        renderProductTags(pot);
        document.getElementById("btn-start-" + pot).disabled = false;
        document.getElementById("btn-end-"   + pot).disabled = true;
      }

      // 90°C 도달
      if (data["90°C도달"] && !sessions[pot].ccp90Time) {
        sessions[pot].ccp90Time = new Date(data["90°C도달"].replace(" ", "T"));
        document.getElementById("card-" + pot).className = "card ccp";
        document.getElementById("badge-" + pot).textContent = "CCP 구간";
        document.getElementById("badge-" + pot).className = "status-badge badge-ccp";
      }

      updateTimeInfo(pot, data);
    }).catch(function() {});
}

function updateTimeInfo(pot, data) {
  var el = document.getElementById("timeinfo-" + pot);
  var start = data["취반시작"] || "--";
  var ccp90 = data["90°C도달"] || "--";
  if (start !== "--") start = start.replace("T", " ").replace("Z", "").substring(0, 19);
  if (ccp90 !== "--") ccp90 = ccp90.replace("T", " ").replace("Z", "").substring(0, 19);
  var ccpMin = "--";
  if (data["90°C도달"]) {
    var diff = Math.floor((new Date() - new Date(data["90°C도달"].replace(" ", "T"))) / 60000);
    ccpMin = diff + "분";
  }
  el.innerHTML =
    "<span>취반시작:</span> " + start + "<br>" +
    "<span>90°C 도달:</span> " + ccp90 + "<br>" +
    "<span>CCP 경과:</span> " + ccpMin;
}

function updateCardUI(pot) {
  var s = sessions[pot];
  var card = document.getElementById("card-" + pot);
  var badge = document.getElementById("badge-" + pot);
  if (s.status === "standby") {
    card.className = "card standby";
    badge.textContent = "대기중";
    badge.className = "status-badge badge-standby";
    document.getElementById("timeinfo-" + pot).innerHTML =
      "<span>취반시작:</span> --<br><span>90°C 도달:</span> --<br><span>CCP 경과:</span> --분";
    document.getElementById("timer-" + pot).textContent = "00:00:00";
    document.getElementById("timer-" + pot).className = "timer";
  } else if (s.status === "cooking") {
    card.className = "card cooking";
    badge.textContent = "취반중";
    badge.className = "status-badge badge-cooking";
  }
}

function updateTimers() {
  var now = new Date();
  for (var i = 1; i <= POT_COUNT; i++) {
    var s = sessions[i];
    if (s.status !== "standby" && s.startTime) {
      var diff = Math.floor((now - s.startTime) / 1000);
      var h = String(Math.floor(diff / 3600)).padStart(2, "0");
      var m = String(Math.floor((diff % 3600) / 60)).padStart(2, "0");
      var sec = String(diff % 60).padStart(2, "0");
      var el = document.getElementById("timer-" + i);
      el.textContent = h + ":" + m + ":" + sec;
      if (s.ccp90Time) el.className = "timer ccp-active";
    }
  }
}

function updateClocks() {
  var now = new Date();
  document.getElementById("clock").textContent =
    String(now.getHours()).padStart(2,"0") + ":" +
    String(now.getMinutes()).padStart(2,"0") + ":" +
    String(now.getSeconds()).padStart(2,"0");
}

function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(function() { t.style.display = "none"; }, 3000);
}
</script>
</body>
</html>
